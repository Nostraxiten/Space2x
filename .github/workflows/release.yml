name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-release-artifacts:
    name: Build Release (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      matrix:
        os: [ ubuntu-22.04, windows-2022 ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libsystemd-dev qt6-base-dev

      - name: Set up MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Set up Ninja (Windows)
        if: runner.os == 'Windows'
        uses: ashutoshvarma/setup-ninja@master
        with:
          version: 1.11.1

      - name: Install Qt6 (Windows)
        if: runner.os == 'Windows'
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.7.2'
          arch: 'win64_msvc2019_64'
          modules: 'qtbase'

      - name: Configure CMake
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DSPACE2X_BUILD_CLI=ON \
            -DSPACE2X_BUILD_UI=ON \
            -DSPACE2X_BUILD_TESTS=OFF

      - name: Build
        run: cmake --build build --config Release

      - name: Package Windows (Standalone GUI Bundle)
        if: runner.os == 'Windows'
        run: |
          mkdir -p dist
          cp build/src/ui/space2x-ui.exe dist/
          cp build/src/cli/space2x.exe dist/
          windeployqt dist/space2x-ui.exe --no-translations --compiler-runtime
          cmake -E tar "cfv" space2x-windows-x64.zip --format=zip dist

      - name: Package Linux (GUI + CLI)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          cp build/src/ui/space2x-ui dist/
          cp build/src/cli/space2x dist/
          tar -czvf space2x-linux-x64.tar.gz -C dist .

      - name: Upload Artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: |
            space2x-windows-x64.zip
            space2x-linux-x64.tar.gz
